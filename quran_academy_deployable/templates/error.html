{% extends "base.html" %}
{% block title %}Error {{ code }} — {{ site.academy_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow center">
    <div class="card empty-state">
      <h1 class="error-code">{{ code }}</h1>
      <p class="muted">{{ message }}</p>
      <a class="btn btn-primary" href="{{ url_for('public.home') }}">Return to Home</a>
    </div>
  </div>
</section>
{% endblock %}
