services:
  - type: web
    name: quran-academy-system
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "."
      - key: STUDENT_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        value: "6666443909,8053250308"
      - key: GOOGLE_SHEET_ID
        value: "1ydLl6IVoEZdXFEZB9rgPHwPn8iBbzUduS4d4IJ8sHFk"
      - key: GOOGLE_SHEET_WEBHOOK_URL
        value: "https://script.google.com/macros/s/AKfycbxj4Ogdc0bAeXVTSNEzpeOHKifhNPFbzuBvzlQ_sC0h0uY1Hf2JSBojRDyEY9JQq7k_yg/exec"
      - key: ADMIN_EMAIL
        value: "admin@academy.test"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "Administrator"
